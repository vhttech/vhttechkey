[package]
name = "vi-daemon"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "vi-daemon"
path = "src/main.rs"

[lib]
name = "vi_daemon"
path = "src/lib.rs"

[dependencies]
vi-core     = { path = "../vi-core" }
vi-platform = { path = "../vi-platform" }
vi-config   = { path = "../vi-config" }
vi-portal   = { path = "../vi-portal" }
vi-ibus     = { path = "../vi-ibus" }
vi-fcitx5   = { path = "../vi-fcitx5" }
vi-wayland  = { path = "../vi-wayland" }
vi-x11      = { path = "../vi-x11" }
x11rb       = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
nix = { workspace = true }
zbus                   = { workspace = true }
wayland-client         = { workspace = true }
wayland-protocols-misc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "startup"
harness = false
