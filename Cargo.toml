[workspace]
members = [
    # Legacy — scheduled for removal in 0.2.0
    "crates/vi-core",
    "crates/vi-portal",
    "crates/vi-config",
    "crates/vi-platform",
    "crates/vi-daemon",
    "crates/vi-ibus",
    "crates/vi-fcitx5",
    "crates/vi-wayland",
    "crates/vi-x11",
    "crates/vi-testing",
    "crates/vi-tools",
    "crates/vi-ui",
]
resolver = "2"

[workspace.lints.rust]
warnings = "warn"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["VHT Tech <vinhhp@vhttech.com>"]

[workspace.dependencies]
# Internal crates
vi-core     = { path = "crates/vi-core" }
vi-config   = { path = "crates/vi-config" }
vi-platform = { path = "crates/vi-platform" }
vi-portal   = { path = "crates/vi-portal" }
vi-testing  = { path = "crates/vi-testing" }
# Async runtime
tokio      = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7" }

# D-Bus / IPC
zbus        = { version = "4.3", features = ["tokio", "p2p"] }
zbus_macros = { version = "4.3" }
zvariant    = { version = "4.1", features = ["gvariant"] }

# Wayland
wayland-client         = { version = "0.31" }
wayland-protocols      = { version = "0.31", features = ["unstable", "client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }

# Unicode
unicode-normalization = { version = "0.1.23" }
unicode-segmentation  = { version = "1.11" }

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
toml       = { version = "0.8" }

# File watching
notify = { version = "6.1", features = ["serde"] }

# Error handling / diagnostics
thiserror = { version = "1.0" }
anyhow    = { version = "1.0" }

# Logging
tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Testing
proptest  = { version = "1.4" }
criterion = { version = "0.5", features = ["html_reports"] }
arbitrary = { version = "1.3", features = ["derive"] }
insta     = { version = "1.38" }

# Data structures
smallvec    = { version = "1.13" }
bitflags    = { version = "2.5" }
phf         = { version = "0.11", features = ["macros"] }
dashmap     = { version = "6.0" }
parking_lot = { version = "0.12" }

# X11
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

# XKB keyboard handling
xkbcommon = { version = "0.7", features = ["wayland"] }

# Serialization (binary)
bincode = { version = "1.3" }

# System
nix = { version = "0.29", features = ["socket", "user"] }

# Fuzzing
libfuzzer-sys = { version = "0.4" }

# Utilities
tempfile    = { version = "3.10" }
futures-util = { version = "0.3" }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
