[InputMethod]
# Unique name for this input method — used as the identifier in Fcitx5.
UniqueName=vhttechkey
# Display name shown in the Fcitx5 input method list.
Name=VHTTechKey
# Display name (native/Vietnamese).
NativeName=Bộ gõ VHTTechKey
# Icon name (must exist under /usr/share/vhttechkey/icons/ or be an XDG icon name).
Icon=/usr/share/vhttechkey/icons/vi.svg
# Language this IM handles.
LangCode=vi
# Path to the executable that Fcitx5 launches.
Exec=/usr/lib/vhttechkey/vi-daemon
# Fcitx5 only launches addons, not standalone daemons;
# vi-daemon connects to Fcitx5 via D-Bus on its own.
Enabled=True
