[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "warn"
highlight = "all"

# Deny multiple versions of these critical crates (zbus, tokio, serde).
# Add [[bans.skip]] entries here for crates that legitimately need
# multiple versions in the transitive dep graph.

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
