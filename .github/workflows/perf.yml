name: Performance
on: [push, pull_request]
jobs:
  perf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential pkg-config \
            libdbus-1-dev libglib2.0-dev libibus-1.0-dev \
            libwayland-dev wayland-protocols \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Startup benchmark
        run: |
          cargo bench --bench startup -p vi-daemon \
            -- --save-baseline ci 2>&1 | tee bench_startup.txt
      - name: Latency benchmark
        run: |
          cargo bench --bench telex_throughput -p vi-core \
            -- --save-baseline ci 2>&1 | tee bench_latency.txt
      - name: Memory budget test
        run: cargo test -p vi-testing memory_budget -- --nocapture
      - name: Enforce performance budgets
        run: |
          python3 scripts/check_perf_regression.py \
            --startup-max-ms 50 --latency-max-p99-us 1000
